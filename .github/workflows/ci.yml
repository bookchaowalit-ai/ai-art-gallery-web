# CI + security baseline (DevSecOps Phase 1). Public repository: GitHub-hosted runners.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-node.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      node-version: "22"
      require-tests: true # ADR-0004: fail if the test script disappears
      coverage-threshold: "98" # ADR-0004 ratchet: measured 98.8% lines (SPEC-001)
      # lint, typecheck and test run the package.json scripts (auto), as the previous workflow did.
      # Kept from the previous workflow: the production Next.js build.
      build-command: NEXT_TELEMETRY_DISABLED=1 npm run build

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1

  # ADR-0007 design floor (12 rules, 5 widths) against `next start` (design-floor.json).
  design-floor:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/design-floor.yml@df695c12bdc6822587877d5fe55d3af31d5f66db # v1.5.11
    with:
      build-command: NEXT_TELEMETRY_DISABLED=1 npm run build
